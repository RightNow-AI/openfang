[package]
name = "omtae-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for the OMTAE Agent OS"

[[bin]]
name = "omtae"
path = "src/main.rs"

[dependencies]
omtae-types = { path = "../omtae-types" }
omtae-kernel = { path = "../omtae-kernel" }
omtae-api = { path = "../omtae-api" }
omtae-migrate = { path = "../omtae-migrate" }
omtae-skills = { path = "../omtae-skills" }
omtae-extensions = { path = "../omtae-extensions" }
zeroize = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
omtae-runtime = { path = "../omtae-runtime" }
uuid = { workspace = true }
ratatui = { workspace = true }
colored = { workspace = true }
tempfile = { workspace = true }
