name: ClawHub fix validation

on:
  push:
    branches:
      - fix/clawhub-publisher-selection-1284
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check compilation
        run: cargo check -p openfang-skills -p openfang-api --lib
      - name: Run ClawHub focused Rust tests
        run: cargo test -p openfang-skills -p openfang-api --lib clawhub
      - name: Run publisher request compatibility tests
        run: cargo test -p openfang-api --lib clawhub_install_request
      - name: Check dashboard JavaScript syntax
        run: node --check crates/openfang-api/static/js/pages/skills.js
